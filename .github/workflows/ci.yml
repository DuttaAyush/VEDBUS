name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit:
    name: Backend unit/security regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:ci
      - run: npm run build

  backend-integration:
    name: Backend isolated PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yatrabus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yatrabus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: BACKEND
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yatrabus_test?schema=public
      TEST_DATABASE_NAME: yatrabus_test
      TEST_DATABASE_ISOLATED: 'true'
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_ISOLATED: 'true'
      JWT_ACCESS_SECRET: ci-integration-access-secret
      JWT_REFRESH_SECRET: ci-integration-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:migrate
      - run: npm run test:integration

  frontend-build:
    name: Frontend Next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - run: npm ci
      - run: npm run build

  admin-lint:
    name: Admin lint and Next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
